.card h3{margin:.2em 0 .4em}
.muted{color:var(--muted)}
.big-emoji{font-size:2.6rem;line-height:1}

.sim-box{background:#f8fafc;border:3px dashed #c7d2fe;border-radius:var(--radius);padding:18px;margin:16px 0}
.sim-box h3{margin-top:0;color:var(--indigo)}
.sim-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.sim-controls label{font-weight:700;font-size:.92rem}

.answer-input{font-size:1.3rem;text-align:center;font-weight:800;max-width:220px}

.qtext{font-size:1.25rem;font-weight:800;line-height:1.5}

{id:"m1",icon:"🔢",color:"#4f46e5",title:{bm:"Nombor Bulat dan Operasi Asas",en:"Whole Numbers and Basic Operations"},
 desc:{bm:"Nombor hingga 1,000,000, nilai tempat, tambah, tolak, darab dan bahagi.",en:"Numbers up to 1,000,000, place value, addition, subtraction, multiplication and division."},
 lessons:[
 {id:"m1l1",title:{bm:"Nilai Tempat dan Nilai Digit",en:"Place Value and Digit Value"},sim:"placevalue",skills:["placevalue","compare","round"],
  ref:"DSKP 4.1.1–4.1.4 (Nombor Bulat hingga 1,000,000)",
  objectives:{bm:["Menyatakan nilai tempat dan nilai digit bagi nombor hingga 1,000,000.","Membanding dan menyusun nombor.","Membundarkan nombor kepada puluh, ratus dan ribu terdekat."],en:["State the place value and digit value of numbers up to 1,000,000.","Compare and order numbers.","Round numbers to the nearest ten, hundred and thousand."]},
  terms:{bm:{"Nilai tempat":"Kedudukan digit dalam nombor (sa, puluh, ratus, ribu…).","Nilai digit":"Nilai sebenar digit mengikut kedudukannya.","Membundar":"Menukar nombor kepada nilai terdekat yang lebih mudah."},en:{"Place value":"The position of a digit in a number (ones, tens, hundreds, thousands…).","Digit value":"The actual value of a digit based on its position.","Rounding":"Changing a number to the nearest easier value."}},
  explain:{bm:`<p>Setiap digit dalam nombor mempunyai <b>nilai tempat</b> yang bergantung pada kedudukannya. Dari kanan: <b>sa → puluh → ratus → ribu → puluh ribu → ratus ribu</b>.</p>
  <p>Contoh: dalam <b>345,678</b>, digit <b>4</b> berada di tempat <b>puluh ribu</b>, jadi nilainya ialah <b>40,000</b>.</p>
  <p><b>Membandingkan nombor:</b> bandingkan bilangan digit dahulu. Jika sama, bandingkan dari digit paling kiri.</p>
  <p><b>Membundarkan:</b> lihat digit di sebelah kanan tempat yang dibundarkan. Jika 5 atau lebih, bundarkan ke atas; jika kurang daripada 5, kekalkan.</p>`,
  en:`<p>Each digit in a number has a <b>place value</b> based on its position. From the right: <b>ones → tens → hundreds → thousands → ten-thousands → hundred-thousands</b>.</p>
  <p>Example: in <b>345,678</b>, the digit <b>4</b> is in the <b>ten-thousands</b> place, so its value is <b>40,000</b>.</p>
  <p><b>Comparing numbers:</b> compare the number of digits first. If equal, compare from the leftmost digit.</p>
  <p><b>Rounding:</b> look at the digit to the right of the rounding place. If 5 or more, round up; if less than 5, keep as is.</p>`},
  examples:[
   {q:{bm:"Apakah nilai digit 7 dalam 72,450?",en:"What is the value of the digit 7 in 72,450?"},steps:{bm:["Digit 7 berada di tempat puluh ribu.","Nilai tempat puluh ribu = 10,000.","Jadi nilai digit 7 ialah 7 × 10,000 = 70,000."],en:["The digit 7 is in the ten-thousands place.","Ten-thousands place = 10,000.","So the value of digit 7 is 7 × 10,000 = 70,000."]}},
   {q:{bm:"Bundarkan 456,789 kepada ratus terdekat.",en:"Round 456,789 to the nearest hundred."},steps:{bm:["Tempat ratus ialah digit 7.","Digit di sebelah kanan ialah 8 (≥ 5).","Bundarkan ke atas: 456,789 → 456,800."],en:["The hundreds place is digit 7.","The digit to its right is 8 (≥ 5).","Round up: 456,789 → 456,800."]}},
   {q:{bm:"Susun nombor berikut dari terkecil ke terbesar: 98,765; 89,765; 98,675.",en:"Order these numbers from smallest to largest: 98,765; 89,765; 98,675."},steps:{bm:["Semua mempunyai 5 digit.","Bandingkan digit paling kiri: 89,765 paling kecil.","Bandingkan 98,765 dan 98,675: digit ketiga 7 > 6, jadi 98,675 lebih kecil.","Susunan: 89,765 < 98,675 < 98,765."],en:["All have 5 digits.","Compare the leftmost digit: 89,765 is smallest.","Compare 98,765 and 98,675: third digit 7 > 6, so 98,675 is smaller.","Order: 89,765 < 98,675 < 98,765."]}}],
  mistakes:{bm:"Kesilapan biasa: membaca nilai digit tanpa mengira kedudukannya (cth: mengatakan nilai 7 ialah 7 dalam 72,450). Ingat: nilai digit = digit × nilai tempatnya!",en:"Common mistake: reading a digit's value without considering its position (e.g. saying the value of 7 is 7 in 72,450). Remember: digit value = digit × its place value!"},
  application:{bm:"Membaca nombor telefon, nombor rumah, harga barang di pasar malam dan jumlah penonton di stadium.",en:"Reading phone numbers, house numbers, prices at the night market and stadium crowd sizes."},
  summary:{bm:"Nilai tempat menentukan nilai digit. Bandingkan nombor dari kiri. Bundarkan mengikut digit di sebelah kanan (5 ke atas → naik).",en:"Place value determines digit value. Compare numbers from the left. Round based on the digit to the right (5 or more → round up)."}},
 {id:"m1l2",title:{bm:"Tambah, Tolak, Darab dan Bahagi",en:"Add, Subtract, Multiply and Divide"},sim:"longops",skills:["addsub","mult","divide","combined"],
  ref:"DSKP 4.2.1–4.2.6 (Operasi Asas)",
  objectives:{bm:["Melakukan tambah dan tolak hingga 1,000,000.","Melakukan darab hingga 1,000 × 1,000 dan bahagi hingga 1,000 ÷ 10.","Menyelesaikan operasi gabungan mengikut urutan operasi."],en:["Add and subtract numbers up to 1,000,000.","Multiply up to 1,000 × 1,000 and divide up to 1,000 ÷ 10.","Solve combined operations following the order of operations."]},
  terms:{bm:{"Mengumpul semula":"Memindahkan nilai 10 dari satu tempat ke tempat yang lebih besar.","Mengurai":"Memecahkan 10 dari satu tempat ke tempat yang lebih kecil.","Urutan operasi":"Darab dan bahagi dahulu, kemudian tambah dan tolak (kurungan dahulu)."},en:{"Regrouping":"Moving 10 from one place to a larger place.","Breaking apart":"Splitting 10 from one place into a smaller place.","Order of operations":"Multiply and divide first, then add and subtract (brackets first)."}},
  explain:{bm:`<p><b>Tambah & tolak:</b> jajar mengikut nilai tempat. Jika jumlah melebihi 9, <b>kumpul semula</b> (bawa 1 ke tempat seterusnya). Jika perlu menolak, <b>uraikan</b> 10 dari tempat yang lebih besar.</p>
  <p><b>Darab:</b> darabkan setiap digit, kumpul semula bila perlu. Contoh: 345 × 27.</p>
  <p><b>Bahagi:</b> bahagi dari digit paling kiri, tulis hasil di atas, darab semula dan tolak.</p>
  <p><b>Operasi gabungan:</b> selesaikan <b>kurungan → darab/bahagi → tambah/tolak</b>.</p>`,
  en:`<p><b>Addition & subtraction:</b> align by place value. If a column exceeds 9, <b>regroup</b> (carry 1 to the next place). If subtraction needs it, <b>break apart</b> 10 from a larger place.</p>
  <p><b>Multiplication:</b> multiply each digit, regroup when needed. Example: 345 × 27.</p>
  <p><b>Division:</b> divide from the leftmost digit, write the result on top, multiply back and subtract.</p>
  <p><b>Combined operations:</b> solve <b>brackets → multiply/divide → add/subtract</b>.</p>`},
  examples:[
   {q:{bm:"345 × 27 = ?",en:"345 × 27 = ?"},steps:{bm:["345 × 7 = 2,415 (darab sa dahulu).","345 × 20 = 6,900 (darab puluh).","Jumlahkan: 2,415 + 6,900 = 9,315."],en:["345 × 7 = 2,415 (multiply ones first).","345 × 20 = 6,900 (multiply tens).","Add: 2,415 + 6,900 = 9,315."]}},
   {q:{bm:"8,432 − 2,759 = ?",en:"8,432 − 2,759 = ?"},steps:{bm:["Sa: 2 − 9 tidak boleh → uraikan 1 puluh: 12 − 9 = 3.","Puluh: 2 (tinggal 2) − 5 tidak boleh → uraikan 1 ratus: 12 − 5 = 7.","Ratus: 3 (tinggal 3) − 7 tidak boleh → uraikan 1 ribu: 13 − 7 = 6.","Ribu: 7 − 2 = 5. Jawapan: 5,673."],en:["Ones: 2 − 9 impossible → break apart 1 ten: 12 − 9 = 3.","Tens: 2 (now 2) − 5 impossible → break apart 1 hundred: 12 − 5 = 7.","Hundreds: 3 (now 3) − 7 impossible → break apart 1 thousand: 13 − 7 = 6.","Thousands: 7 − 2 = 5. Answer: 5,673."]}},
   {q:{bm:"120 ÷ 8 = ?",en:"120 ÷ 8 = ?"},steps:{bm:["8 × 10 = 80. Baki 120 − 80 = 40.","8 × 5 = 40. Baki 0.","Jadi 120 ÷ 8 = 10 + 5 = 15."],en:["8 × 10 = 80. Remainder 120 − 80 = 40.","8 × 5 = 40. Remainder 0.","So 120 ÷ 8 = 10 + 5 = 15."]}}],
  mistakes:{bm:"Kesilapan biasa: tertukar darab dengan tambah (cth: 3 × 4 = 7). Ingat: darab ialah tambah berulang — 3 × 4 = 4 + 4 + 4 = 12. Juga jangan lupa jajar mengikut nilai tempat!",en:"Common mistake: confusing multiplication with addition (e.g. 3 × 4 = 7). Remember: multiplication is repeated addition — 3 × 4 = 4 + 4 + 4 = 12. Also don't forget to align by place value!"},
  application:{bm:"Mengira jumlah belanja, membahagi makanan sama rata antara ahli keluarga, dan mengira baki wang.",en:"Calculating shopping totals, sharing food equally among family members, and counting change."},
  summary:{bm:"Jajar mengikut nilai tempat. Kumpul semula bila perlu. Darab = tambah berulang. Urutan: kurungan → darab/bahagi → tambah/tolak.",en:"Align by place value. Regroup when needed. Multiplication = repeated addition. Order: brackets → multiply/divide → add/subtract."}},

 lessons:[
 {id:"m2l1",title:{bm:"Pecahan Setara dan Perbandingan",en:"Equivalent Fractions and Comparison"},sim:"fraction",skills:["fractions","fractioncompare"],
  ref:"DSKP 5.1.1–5.1.3 (Pecahan)",
  objectives:{bm:["Mengenal pasti pecahan setara.","Membandingkan pecahan menggunakan bar pecahan.","Mendarab pecahan dengan nombor bulat."],en:["Identify equivalent fractions.","Compare fractions using fraction bars.","Multiply fractions by whole numbers."]},
  terms:{bm:{"Pengangka":"Nombor di atas garis pecahan (bilangan bahagian yang diambil).","Penyebut":"Nombor di bawah garis pecahan (bilangan bahagian yang sama besar).","Pecahan setara":"Pecahan yang mempunyai nilai yang sama walaupun pengangka dan penyebut berbeza."},en:{"Numerator":"The number above the fraction line (parts taken).","Denominator":"The number below the line (equal parts).","Equivalent fraction":"Fractions with the same value even though numerator and denominator differ."}},
  explain:{bm:`<p>Pecahan <b>a/b</b> bermaksud <b>a</b> bahagian daripada <b>b</b> bahagian yang sama besar.</p>
  <p><b>Pecahan setara:</b> darab atau bahagi pengangka dan penyebut dengan nombor yang sama. Contoh: 1/2 = 2/4 = 3/6.</p>
  <p><b>Membandingkan:</b> jika penyebut sama, bandingkan pengangka. Jika pengangka sama, pecahan dengan penyebut lebih kecil adalah lebih besar.</p>
  <p><b>Darab pecahan dengan nombor bulat:</b> darabkan pengangka sahaja. Contoh: 3 × 2/5 = 6/5.</p>`,
  en:`<p>The fraction <b>a/b</b> means <b>a</b> parts out of <b>b</b> equal parts.</p>
  <p><b>Equivalent fractions:</b> multiply or divide both numerator and denominator by the same number. Example: 1/2 = 2/4 = 3/6.</p>
  <p><b>Comparing:</b> if denominators are equal, compare numerators. If numerators are equal, the fraction with the smaller denominator is larger.</p>
  <p><b>Multiplying a fraction by a whole number:</b> multiply only the numerator. Example: 3 × 2/5 = 6/5.</p>`},
  examples:[
   {q:{bm:"Tulis pecahan setara bagi 2/3 dengan penyebut 12.",en:"Write an equivalent fraction for 2/3 with denominator 12."},steps:{bm:["3 × 4 = 12, jadi darabkan dengan 4.","2 × 4 = 8.","2/3 = 8/12."],en:["3 × 4 = 12, so multiply by 4.","2 × 4 = 8.","2/3 = 8/12."]}},
   {q:{bm:"Yang mana lebih besar: 3/4 atau 5/8?",en:"Which is larger: 3/4 or 5/8?"},steps:{bm:["Samakan penyebut: 3/4 = 6/8.","Bandingkan 6/8 dengan 5/8.","6 > 5, jadi 3/4 lebih besar."],en:["Make denominators equal: 3/4 = 6/8.","Compare 6/8 with 5/8.","6 > 5, so 3/4 is larger."]}},
   {q:{bm:"4 × 3/7 = ?",en:"4 × 3/7 = ?"},steps:{bm:["Darabkan pengangka: 4 × 3 = 12.","Penyebut kekal 7.","Jawapan: 12/7 = 1 5/7."],en:["Multiply the numerator: 4 × 3 = 12.","Denominator stays 7.","Answer: 12/7 = 1 5/7."]}}],
  mistakes:{bm:"Kesilapan biasa: menambah penyebut semasa menambah pecahan (cth: 1/2 + 1/3 = 2/5 — SALAH!). Penyebut mesti disamakan dahulu. Juga, jangan tertukar pengangka dengan penyebut!",en:"Common mistake: adding denominators when adding fractions (e.g. 1/2 + 1/3 = 2/5 — WRONG!). Denominators must be made equal first. Also, don't swap numerator and denominator!"},
  application:{bm:"Membahagi piza dan kek sama rata, mengukur bahan masakan (1/2 cawan tepung), dan membahagi masa.",en:"Sharing pizza and cake equally, measuring ingredients (1/2 cup of flour), and dividing time."},
  summary:{bm:"Pecahan setara dikekalkan dengan mendarab/membahagi kedua-dua bahagian. Samakan penyebut untuk membandingkan. Darab pecahan dengan nombor bulat: darab pengangka sahaja.",en:"Equivalent fractions keep the same value by multiplying/dividing both parts. Make denominators equal to compare. To multiply a fraction by a whole number: multiply the numerator only."}},
 {id:"m2l2",title:{bm:"Perpuluhan dan Peratus",en:"Decimals and Percentages"},sim:"percent",skills:["decimals","percent","convert"],
  ref:"DSKP 5.2.1–5.3.2 (Perpuluhan dan Peratus)",
  objectives:{bm:["Melakukan operasi tambah, tolak dan darab perpuluhan.","Menukar pecahan kepada perpuluhan dan peratus.","Mengira peratus daripada kuantiti."],en:["Add, subtract and multiply decimals.","Convert fractions to decimals and percentages.","Calculate percentages of quantities."]},
  terms:{bm:{"Perpuluhan":"Nombor dengan titik perpuluhan (cth: 0.5, 3.25).","Peratus":"Bilangan bahagian daripada 100. Simbol %."},en:{"Decimal":"A number with a decimal point (e.g. 0.5, 3.25).","Percentage":"Parts out of 100. Symbol %."}},
  explain:{bm:`<p><b>Perpuluhan:</b> digit selepas titik perpuluhan ialah persepuluhan, perseratus, perseribu. Apabila menambah/menolak, <b>jajarkan titik perpuluhan</b>!</p>
  <p><b>Peratus:</b> 1% = 1/100 = 0.01. Jadi 50% = 50/100 = 0.5.</p>
  <p><b>Penukaran:</b> pecahan → peratus: bahagi pengangka dengan penyebut, kemudian darab 100. Contoh: 3/4 = 0.75 = 75%.</p>
  <p><b>Mengira peratus:</b> 20% daripada 250 = 20/100 × 250 = 50.</p>`,
  en:`<p><b>Decimals:</b> digits after the decimal point are tenths, hundredths, thousandths. When adding/subtracting, <b>align the decimal points</b>!</p>
  <p><b>Percentages:</b> 1% = 1/100 = 0.01. So 50% = 50/100 = 0.5.</p>
  <p><b>Conversion:</b> fraction → percent: divide numerator by denominator, then multiply by 100. Example: 3/4 = 0.75 = 75%.</p>
  <p><b>Calculating percentages:</b> 20% of 250 = 20/100 × 250 = 50.</p>`},
  examples:[
   {q:{bm:"3.45 + 2.6 = ?",en:"3.45 + 2.6 = ?"},steps:{bm:["Jajarkan titik perpuluhan: 3.45 + 2.60.","Sa: 5 + 0 = 5. Perseratus: 4 + 6 = 10 → tulis 0, kumpul 1.","Persepuluhan: 5 + 2 + 1 (kumpulan) = 8.","Sa: 3 + 2 = 5. Jawapan: 6.05."],en:["Align decimal points: 3.45 + 2.60.","Hundredths: 5 + 0 = 5. Tenths: 4 + 6 = 10 → write 0, carry 1.","Tenths: 5 + 2 + 1 (carry) = 8.","Ones: 3 + 2 = 5. Answer: 6.05."]}},
   {q:{bm:"Tukar 3/8 kepada peratus.",en:"Convert 3/8 to a percentage."},steps:{bm:["3 ÷ 8 = 0.375.","0.375 × 100 = 37.5.","3/8 = 37.5%."],en:["3 ÷ 8 = 0.375.","0.375 × 100 = 37.5.","3/8 = 37.5%."]}},
   {q:{bm:"25% daripada RM 80 = ?",en:"25% of RM 80 = ?"},steps:{bm:["25% = 25/100 = 1/4.","1/4 × 80 = 20.","Jawapan: RM 20."],en:["25% = 25/100 = 1/4.","1/4 × 80 = 20.","Answer: RM 20."]}}],
  mistakes:{bm:"Kesilapan biasa: tidak menjajarkan titik perpuluhan (cth: 3.45 + 2.6 ditulis sebagai 3.45 + 2.6 tanpa menambah 0). Ingat: 2.6 = 2.60!",en:"Common mistake: not aligning decimal points (e.g. adding 3.45 + 2.6 without adding the 0). Remember: 2.6 = 2.60!"},
  application:{bm:"Diskaun di kedai (20% OFF), markah ujian, kadar faedah simpanan dan peratusan bateri telefon.",en:"Shop discounts (20% OFF), test marks, savings interest rates and phone battery percentages."},
  summary:{bm:"Jajarkan titik perpuluhan untuk tambah/tolak. Peratus = bahagian daripada 100. Tukar pecahan kepada peratus dengan membahagi kemudian darab 100.",en:"Align decimal points for add/subtract. Percent = parts out of 100. Convert fractions to percents by dividing then multiplying by 100."}}]},
{id:"m3",icon:"💰",color:"#059669",title:{bm:"Wang",en:"Money"},
 desc:{bm:"Mata wang Malaysia, operasi wang, simpanan, bajet dan literasi kewangan.",en:"Malaysian currency, money operations, savings, budgeting and financial literacy."},
 lessons:[
 {id:"m3l1",title:{bm:"Operasi Wang dan Baki",en:"Money Operations and Change"},sim:"shop",skills:["money","change"],
  ref:"DSKP 6.1.1–6.2.2 (Wang)",
  objectives:{bm:["Melakukan tambah, tolak, darab dan bahagi melibatkan wang.","Mengira baki wang selepas pembelian."],en:["Add, subtract, multiply and divide involving money.","Calculate change after a purchase."]},
  terms:{bm:{"Baki":"Wang yang dikembalikan selepas pembayaran.","Sen":"Unit wang yang lebih kecil: RM 1 = 100 sen."},en:{"Change":"Money returned after payment.","Sen (cent)":"Smaller money unit: RM 1 = 100 sen."}},
  explain:{bm:`<p>Gunakan <b>sen</b> untuk mengelakkan kesilapan perpuluhan: RM 12.50 = 1,250 sen.</p>
  <p><b>Baki</b> = wang dibayar − harga barang. Contoh: bayar RM 50 untuk barang RM 37.80 → baki RM 12.20.</p>
  <p><b>Darab wang:</b> 4 × RM 6.50 = RM 26.00. <b>Bahagi wang:</b> RM 90 ÷ 3 = RM 30 setiap orang.</p>`,
  en:`<p>Use <b>cents</b> to avoid decimal errors: RM 12.50 = 1,250 cents.</p>
  <p><b>Change</b> = money paid − price. Example: pay RM 50 for items costing RM 37.80 → change RM 12.20.</p>
  <p><b>Multiply money:</b> 4 × RM 6.50 = RM 26.00. <b>Divide money:</b> RM 90 ÷ 3 = RM 30 each.</p>`},
  examples:[
   {q:{bm:"Baki daripada RM 50 selepas membeli barang RM 37.80?",en:"Change from RM 50 after buying items for RM 37.80?"},steps:{bm:["Baki = 50.00 − 37.80.","50.00 − 37.80 = 12.20.","Baki: RM 12.20."],en:["Change = 50.00 − 37.80.","50.00 − 37.80 = 12.20.","Change: RM 12.20."]}},
   {q:{bm:"Harga 3 buku ialah RM 8.50 setiap satu. Jumlah kos?",en:"3 books cost RM 8.50 each. Total cost?"},steps:{bm:["3 × 8.50.","8.50 × 3 = 25.50.","Jumlah: RM 25.50."],en:["3 × 8.50.","8.50 × 3 = 25.50.","Total: RM 25.50."]}},
   {q:{bm:"RM 96 dibahagi sama rata antara 4 orang. Setiap orang dapat?",en:"RM 96 shared equally among 4 people. Each gets?"},steps:{bm:["96 ÷ 4 = 24.","Setiap orang: RM 24."],en:["96 ÷ 4 = 24.","Each person: RM 24."]}}],
  mistakes:{bm:"Kesilapan biasa: melupakan titik perpuluhan dalam wang (cth: RM 12.5 bermaksud RM 12.50, bukan RM 125!). Sentiasa tulis dua digit sen.",en:"Common mistake: forgetting the decimal point in money (e.g. RM 12.5 means RM 12.50, not RM 125!). Always write two sen digits."},
  application:{bm:"Membeli-belah di pasar, mengira baki di kedai runcit, dan membahagi kos makanan bersama keluarga.",en:"Shopping at the market, counting change at the grocery shop, and splitting food costs with family."},
  summary:{bm:"Tukar wang kepada sen untuk pengiraan tepat. Baki = wang dibayar − harga. Sentiasa tulis dua digit sen.",en:"Convert money to cents for exact calculation. Change = money paid − price. Always write two sen digits."}},
 {id:"m3l2",title:{bm:"Simpanan, Bajet dan Faedah",en:"Savings, Budgeting and Interest"},sim:"savings",skills:["savings","budget","interest"],
  ref:"DSKP 6.3.1–6.4.2 (Simpanan dan Faedah)",
  objectives:{bm:["Merancang bajet perbelanjaan.","Mengira simpanan dan faedah mudah.","Membezakan keperluan dan kehendak."],en:["Plan a spending budget.","Calculate savings and simple interest.","Distinguish needs from wants."]},
  terms:{bm:{"Bajet":"Pelan perbelanjaan yang dirancang mengikut pendapatan.","Faedah":"Wang tambahan yang diperoleh daripada simpanan di bank.","Keperluan":"Perkara penting untuk hidup (makanan, pakaian, buku).","Kehendak":"Perkara yang diinginkan tetapi tidak penting (mainan, snek)."},en:{"Budget":"A planned spending list based on income.","Interest":"Extra money earned from savings in a bank.","Needs":"Important things for living (food, clothes, books).","Wants":"Things we desire but don't need (toys, snacks)."}},
  explain:{bm:`<p><b>Bajet:</b> senaraikan pendapatan, tolak keperluan dahulu, kemudian kehendak, dan simpan selebihnya.</p>
  <p><b>Faedah mudah:</b> Faedah = Pokok × Kadar × Masa. Contoh: RM 1,000 pada 4% setahun selama 1 tahun = 1,000 × 0.04 × 1 = RM 40.</p>
  <p><b>Matlamat simpanan:</b> jumlah perlu disimpan ÷ bilangan minggu = simpanan setiap minggu.</p>`,
  en:`<p><b>Budget:</b> list income, subtract needs first, then wants, and save the rest.</p>
  <p><b>Simple interest:</b> Interest = Principal × Rate × Time. Example: RM 1,000 at 4% per year for 1 year = 1,000 × 0.04 × 1 = RM 40.</p>
  <p><b>Savings goal:</b> total to save ÷ number of weeks = savings per week.</p>`},
  examples:[
   {q:{bm:"Faedah bagi RM 2,000 pada kadar 5% setahun selama 2 tahun?",en:"Interest on RM 2,000 at 5% per year for 2 years?"},steps:{bm:["Faedah setahun: 2,000 × 0.05 = RM 100.","Untuk 2 tahun: 100 × 2 = RM 200.","Jumlah simpanan: 2,000 + 200 = RM 2,200."],en:["Interest per year: 2,000 × 0.05 = RM 100.","For 2 years: 100 × 2 = RM 200.","Total savings: 2,000 + 200 = RM 2,200."]}},
   {q:{bm:"Matlamat RM 480 dalam 12 minggu. Berapa setiap minggu?",en:"Goal of RM 480 in 12 weeks. How much per week?"},steps:{bm:["480 ÷ 12 = 40.","Simpan RM 40 setiap minggu."],en:["480 ÷ 12 = 40.","Save RM 40 every week."]}},
   {q:{bm:"Pendapatan RM 100. Keperluan RM 70, simpanan RM 20. Berapa untuk kehendak?",en:"Income RM 100. Needs RM 70, savings RM 20. How much for wants?"},steps:{bm:["100 − 70 − 20 = 10.","RM 10 untuk kehendak."],en:["100 − 70 − 20 = 10.","RM 10 for wants."]}}],
  mistakes:{bm:"Kesilapan biasa: membelanjakan kehendak dahulu sebelum keperluan dan simpanan. Ingat: keperluan → simpanan → kehendak!",en:"Common mistake: spending on wants before needs and savings. Remember: needs → savings → wants!"},
  application:{bm:"Menyimpan untuk basikal, merancang belanja sekolah, dan memahami faedah simpanan bank.",en:"Saving for a bicycle, planning school spending, and understanding bank savings interest."},
  summary:{bm:"Bajet: keperluan dahulu, kemudian simpanan, akhir sekali kehendak. Faedah mudah = Pokok × Kadar × Masa.",en:"Budget: needs first, then savings, wants last. Simple interest = Principal × Rate × Time."}}]},
{id:"m4",icon:"⏰",color:"#ea580c",title:{bm:"Masa dan Waktu",en:"Time"},
 desc:{bm:"Unit masa, penukaran, tempoh, operasi masa dan jadual harian.",en:"Time units, conversions, duration, time operations and daily schedules."},
 lessons:[
 {id:"m4l1",title:{bm:"Unit Masa dan Penukaran",en:"Time Units and Conversions"},sim:"clock",skills:["timeunits","timeconvert"],
  ref:"DSKP 7.1.1–7.2.2 (Masa dan Waktu)",
  objectives:{bm:["Menukar unit masa (saat, minit, jam, hari, minggu).","Membaca jam analog dan digital.","Menukar masa 12 jam kepada 24 jam."],en:["Convert time units (seconds, minutes, hours, days, weeks).","Read analogue and digital clocks.","Convert 12-hour time to 24-hour time."]},
  terms:{bm:{"Tempoh":"Jangka masa antara dua waktu.","Jam 24":"Sistem masa 00:00–23:59 tanpa AM/PM."},en:{"Duration":"The length of time between two times.","24-hour clock":"Time system 00:00–23:59 without AM/PM."}},
  explain:{bm:`<p>Ingat: <b>60 saat = 1 minit</b>, <b>60 minit = 1 jam</b>, <b>24 jam = 1 hari</b>, <b>7 hari = 1 minggu</b>.</p>
  <p><b>Jam analog:</b> jarum pendek = jam, jarum panjang = minit (setiap nombor = 5 minit).</p>
  <p><b>Jam 24:</b> 2:30 PM = 14:30. Tengah hari (12 PM) = 12:00, tengah malam (12 AM) = 00:00.</p>`,
  en:`<p>Remember: <b>60 seconds = 1 minute</b>, <b>60 minutes = 1 hour</b>, <b>24 hours = 1 day</b>, <b>7 days = 1 week</b>.</p>
  <p><b>Analogue clock:</b> short hand = hours, long hand = minutes (each number = 5 minutes).</p>
  <p><b>24-hour clock:</b> 2:30 PM = 14:30. Noon (12 PM) = 12:00, midnight (12 AM) = 00:00.</p>`},
  examples:[
   {q:{bm:"Tukar 3 jam kepada minit.",en:"Convert 3 hours to minutes."},steps:{bm:["1 jam = 60 minit.","3 × 60 = 180.","3 jam = 180 minit."],en:["1 hour = 60 minutes.","3 × 60 = 180.","3 hours = 180 minutes."]}},
   {q:{bm:"Tukar 14:45 kepada masa 12 jam.",en:"Convert 14:45 to 12-hour time."},steps:{bm:["14 − 12 = 2.","14:45 ialah selepas tengah hari → PM.","2:45 PM."],en:["14 − 12 = 2.","14:45 is after noon → PM.","2:45 PM."]}},
   {q:{bm:"Tukar 2.5 jam kepada minit.",en:"Convert 2.5 hours to minutes."},steps:{bm:["2 jam = 120 minit.","0.5 jam = 30 minit.","Jumlah: 150 minit."],en:["2 hours = 120 minutes.","0.5 hour = 30 minutes.","Total: 150 minutes."]}}],
  mistakes:{bm:"Kesilapan biasa: tertukar jarum jam dan jarum minit. Jarum pendek = jam (bergerak perlahan), jarum panjang = minit (bergerak pantas)!",en:"Common mistake: swapping the hour and minute hands. Short hand = hours (moves slowly), long hand = minutes (moves quickly)!"},
  application:{bm:"Membaca jadual bas, mengira masa perjalanan ke sekolah, dan merancang aktiviti harian.",en:"Reading bus timetables, calculating travel time to school, and planning daily activities."},
  summary:{bm:"60 saat = 1 minit, 60 minit = 1 jam, 24 jam = 1 hari. Jarum pendek = jam, jarum panjang = minit.",en:"60 seconds = 1 minute, 60 minutes = 1 hour, 24 hours = 1 day. Short hand = hours, long hand = minutes."}},
 {id:"m4l2",title:{bm:"Tempoh dan Operasi Masa",en:"Duration and Time Operations"},sim:"duration",skills:["duration","timetable"],
  ref:"DSKP 7.3.1–7.4.2 (Tempoh dan Jadual)",
  objectives:{bm:["Mengira tempoh antara dua waktu.","Menyelesaikan masalah melibatkan jadual dan tempoh."],en:["Calculate the duration between two times.","Solve problems involving timetables and durations."]},
  terms:{bm:{"Jadual":"Senarai waktu aktiviti yang tersusun."},en:{"Timetable":"An organised list of activity times."}},
  explain:{bm:`<p><b>Tempoh</b> = waktu tamat − waktu mula. Jika minit perlu dipinjam, pinjam 1 jam = 60 minit.</p>
  <p>Contoh: dari 9:50 AM hingga 11:20 AM → 11:20 − 9:50 = 1 jam 30 minit.</p>
  <p><b>Menambah masa:</b> 2 jam 45 minit + 1 jam 30 minit = 4 jam 15 minit.</p>`,
  en:`<p><b>Duration</b> = end time − start time. If minutes need borrowing, borrow 1 hour = 60 minutes.</p>
  <p>Example: from 9:50 AM to 11:20 AM → 11:20 − 9:50 = 1 hour 30 minutes.</p>
  <p><b>Adding time:</b> 2 hours 45 minutes + 1 hour 30 minutes = 4 hours 15 minutes.</p>`},
  examples:[
   {q:{bm:"Tempoh dari 9:50 AM hingga 11:20 AM?",en:"Duration from 9:50 AM to 11:20 AM?"},steps:{bm:["11:20 − 9:50.","Pinjam 1 jam: 11:20 → 10:80.","10:80 − 9:50 = 1 jam 30 minit."],en:["11:20 − 9:50.","Borrow 1 hour: 11:20 → 10:80.","10:80 − 9:50 = 1 hour 30 minutes."]}},
   {q:{bm:"Bas bertolak 7:15 AM, tiba 8:45 AM. Tempoh perjalanan?",en:"Bus departs 7:15 AM, arrives 8:45 AM. Travel duration?"},steps:{bm:["8:45 − 7:15.","Jam: 8 − 7 = 1. Minit: 45 − 15 = 30.","1 jam 30 minit."],en:["8:45 − 7:15.","Hours: 8 − 7 = 1. Minutes: 45 − 15 = 30.","1 hour 30 minutes."]}},
   {q:{bm:"Kelas bermula 10:00 AM dan berlangsung 1 jam 45 minit. Bila tamat?",en:"Class starts 10:00 AM and lasts 1 hour 45 minutes. When does it end?"},steps:{bm:["10:00 + 1 jam = 11:00.","11:00 + 45 minit = 11:45.","Tamat pada 11:45 AM."],en:["10:00 + 1 hour = 11:00.","11:00 + 45 minutes = 11:45.","Ends at 11:45 AM."]}}],
  mistakes:{bm:"Kesilapan biasa: melupakan bahawa 1 jam = 60 minit semasa meminjam. Tulis semula waktu dengan 60 minit tambahan sebelum menolak!",en:"Common mistake: forgetting that 1 hour = 60 minutes when borrowing. Rewrite the time with 60 extra minutes before subtracting!"},
  application:{bm:"Mengira masa perjalanan, merancang jadual belajar, dan memastikan tidak terlewat kelas.",en:"Calculating travel time, planning study schedules, and not missing classes."},
  summary:{bm:"Tempoh = tamat − mula. Pinjam 60 minit bila perlu. Tambah jam dan minit secara berasingan, kemudian kumpulkan lebihan 60 minit.",en:"Duration = end − start. Borrow 60 minutes when needed. Add hours and minutes separately, then regroup excess 60 minutes."}}]},
{id:"m5",icon:"📏",color:"#0ea5e9",title:{bm:"Ukuran dan Sukatan",en:"Measurement"},
 desc:{bm:"Panjang, jisim, isipadu cecair, penukaran unit dan penyelesaian masalah.",en:"Length, mass, liquid volume, unit conversions and problem solving."},
 lessons:[
 {id:"m5l1",title:{bm:"Panjang, Jisim dan Isipadu",en:"Length, Mass and Volume"},sim:"ruler",skills:["length","mass","volume"],
  ref:"DSKP 8.1.1–8.3.2 (Ukuran)",
  objectives:{bm:["Mengukur panjang, jisim dan isipadu dengan unit piawai.","Menukar unit (m↔cm, kg↔g, L↔mL).","Melakukan operasi melibatkan ukuran."],en:["Measure length, mass and volume with standard units.","Convert units (m↔cm, kg↔g, L↔mL).","Perform operations involving measurements."]},
  terms:{bm:{"Unit piawai":"Unit ukuran yang diterima di seluruh dunia (meter, kilogram, liter).","Perimeter":"Jumlah panjang semua sisi bentuk."},en:{"Standard unit":"Measurement units accepted worldwide (metre, kilogram, litre).","Perimeter":"The total length of all sides of a shape."}},
  explain:{bm:`<p><b>Panjang:</b> mm, cm, m, km. <b>Jisim:</b> g, kg. <b>Isipadu cecair:</b> mL, L.</p>
  <p>Penukaran penting: <b>1 m = 100 cm</b>, <b>1 km = 1,000 m</b>, <b>1 kg = 1,000 g</b>, <b>1 L = 1,000 mL</b>.</p>
  <p>Untuk menukar kepada unit lebih kecil, <b>darab</b>. Kepada unit lebih besar, <b>bahagi</b>.</p>`,
  en:`<p><b>Length:</b> mm, cm, m, km. <b>Mass:</b> g, kg. <b>Liquid volume:</b> mL, L.</p>
  <p>Key conversions: <b>1 m = 100 cm</b>, <b>1 km = 1,000 m</b>, <b>1 kg = 1,000 g</b>, <b>1 L = 1,000 mL</b>.</p>
  <p>To convert to a smaller unit, <b>multiply</b>. To a larger unit, <b>divide</b>.</p>`},
  examples:[
   {q:{bm:"Tukar 2.5 m kepada cm.",en:"Convert 2.5 m to cm."},steps:{bm:["1 m = 100 cm.","2.5 × 100 = 250.","2.5 m = 250 cm."],en:["1 m = 100 cm.","2.5 × 100 = 250.","2.5 m = 250 cm."]}},
   {q:{bm:"Tukar 3,500 g kepada kg.",en:"Convert 3,500 g to kg."},steps:{bm:["1 kg = 1,000 g.","3,500 ÷ 1,000 = 3.5.","3,500 g = 3.5 kg."],en:["1 kg = 1,000 g.","3,500 ÷ 1,000 = 3.5.","3,500 g = 3.5 kg."]}},
   {q:{bm:"Sebuah botol mengandungi 750 mL jus. Berapa liter?",en:"A bottle contains 750 mL of juice. How many litres?"},steps:{bm:["1 L = 1,000 mL.","750 ÷ 1,000 = 0.75.","750 mL = 0.75 L."],en:["1 L = 1,000 mL.","750 ÷ 1,000 = 0.75.","750 mL = 0.75 L."]}}],
  mistakes:{bm:"Kesilapan biasa: melupakan penukaran unit sebelum mengira (cth: 2 m + 50 cm tidak boleh ditambah terus!). Tukar kepada unit yang sama dahulu!",en:"Common mistake: forgetting to convert units before calculating (e.g. 2 m + 50 cm cannot be added directly!). Convert to the same unit first!"},
  application:{bm:"Mengukur tinggi, menimbang bahan masakan, menyukat air dan mengira jarak perjalanan.",en:"Measuring height, weighing cooking ingredients, measuring water and calculating travel distances."},
  summary:{bm:"1 m = 100 cm, 1 kg = 1,000 g, 1 L = 1,000 mL. Unit lebih kecil → darab; unit lebih besar → bahagi.",en:"1 m = 100 cm, 1 kg = 1,000 g, 1 L = 1,000 mL. Smaller unit → multiply; larger unit → divide."}},
 {id:"m5l2",title:{bm:"Penyelesaian Masalah Ukuran",en:"Measurement Problem Solving"},sim:"units",skills:["measureword","measureops"],
  ref:"DSKP 8.4.1–8.5.2 (Masalah Ukuran)",
  objectives:{bm:["Menyelesaikan masalah ayat melibatkan ukuran.","Mengira perimeter dan menggunakan ukuran dalam kehidupan harian."],en:["Solve word problems involving measurement.","Calculate perimeter and use measurement in daily life."]},
  terms:{bm:{"Perimeter":"Jumlah semua sisi bentuk."},en:{"Perimeter":"The sum of all sides of a shape."}},
  explain:{bm:`<p><b>Perimeter</b> segi empat tepat = 2 × (panjang + lebar).</p>
  <p>Apabila menyelesaikan masalah ukuran: (1) tukar unit kepada yang sama, (2) pilih operasi, (3) kira, (4) tulis unit dalam jawapan!</p>`,
  en:`<p><b>Perimeter</b> of a rectangle = 2 × (length + width).</p>
  <p>When solving measurement problems: (1) convert to the same unit, (2) choose the operation, (3) calculate, (4) write the unit in your answer!</p>`},
  examples:[
   {q:{bm:"Perimeter segi empat tepat 12 cm × 8 cm?",en:"Perimeter of a 12 cm × 8 cm rectangle?"},steps:{bm:["Perimeter = 2 × (12 + 8).","12 + 8 = 20.","2 × 20 = 40 cm."],en:["Perimeter = 2 × (12 + 8).","12 + 8 = 20.","2 × 20 = 40 cm."]}},
   {q:{bm:"Tali sepanjang 3 m dipotong kepada 6 bahagian sama panjang. Setiap bahagian?",en:"A 3 m rope is cut into 6 equal parts. Each part?"},steps:{bm:["3 m = 300 cm.","300 ÷ 6 = 50.","Setiap bahagian 50 cm."],en:["3 m = 300 cm.","300 ÷ 6 = 50.","Each part is 50 cm."]}},
   {q:{bm:"Sebuah jag 2 L diisi dengan cawan 250 mL. Berapa cawan?",en:"A 2 L jug is filled with 250 mL cups. How many cups?"},steps:{bm:["2 L = 2,000 mL.","2,000 ÷ 250 = 8.","8 cawan."],en:["2 L = 2,000 mL.","2,000 ÷ 250 = 8.","8 cups."]}}],
  mistakes:{bm:"Kesilapan biasa: meninggalkan unit dalam jawapan atau tertukar unit. Sentiasa semak: adakah jawapan masuk akal? (cth: tinggi manusia tidak mungkin 300 m!)",en:"Common mistake: leaving out units or mixing units. Always check: does the answer make sense? (e.g. a person's height cannot be 300 m!)"},
  application:{bm:"Mengira pagar taman, mengukur bahan binaan, dan menyukat minuman untuk majlis.",en:"Calculating garden fencing, measuring building materials, and measuring drinks for a party."},
  summary:{bm:"Tukar unit dahulu. Perimeter = jumlah semua sisi. Sentiasa tulis unit dalam jawapan.",en:"Convert units first. Perimeter = sum of all sides. Always write the unit in your answer."}}]},
{id:"m6",icon:"📐",color:"#7c3aed",title:{bm:"Ruang",en:"Space and Geometry"},
 desc:{bm:"Bentuk 2D dan 3D, sudut, perimeter, luas dan isipadu.",en:"2D and 3D shapes, angles, perimeter, area and volume."},
 lessons:[
 {id:"m6l1",title:{bm:"Bentuk 2D dan 3D",en:"2D and 3D Shapes"},sim:"geometry",skills:["shapes2d","shapes3d"],
  ref:"DSKP 9.1.1–9.2.2 (Ruang)",
  objectives:{bm:["Mengenal pasti bentuk 2D dan 3D.","Mengenal pasti sifat bentuk (sisi, bucu, muka).","Mengira sudut menggunakan protraktor."],en:["Identify 2D and 3D shapes.","Identify shape properties (sides, vertices, faces).","Measure angles with a protractor."]},
  terms:{bm:{"Bucu":"Titik pertemuan dua sisi.","Muka":"Permukaan rata bagi bentuk 3D.","Sudut":"Putaran antara dua garis yang bertemu pada satu titik."},en:{"Vertex":"The point where two sides meet.","Face":"A flat surface of a 3D shape.","Angle":"The turn between two lines meeting at a point."}},
  explain:{bm:`<p><b>Bentuk 2D</b> (rata): segi tiga (3 sisi), segi empat sama (4 sisi sama), segi empat tepat, bulatan.</p>
  <p><b>Bentuk 3D</b>: kubus (6 muka segi empat sama, 8 bucu), kuboid, silinder, kon, sfera, piramid.</p>
  <p><b>Sudut</b> diukur dalam darjah (°). Sudut tegak = 90°. Jumlah sudut segi tiga = 180°.</p>`,
  en:`<p><b>2D shapes</b> (flat): triangle (3 sides), square (4 equal sides), rectangle, circle.</p>
  <p><b>3D shapes</b>: cube (6 square faces, 8 vertices), cuboid, cylinder, cone, sphere, pyramid.</p>
  <p><b>Angles</b> are measured in degrees (°). A right angle = 90°. Angles in a triangle sum to 180°.</p>`},
  examples:[
   {q:{bm:"Berapa bucu pada kubus?",en:"How many vertices does a cube have?"},steps:{bm:["Kubus mempunyai 6 muka segi empat sama.","Setiap muka mempunyai 4 bucu.","Jumlah bucu: 8."],en:["A cube has 6 square faces.","Each face has 4 vertices.","Total vertices: 8."]}},
   {q:{bm:"Sudut ketiga segi tiga dengan sudut 60° dan 70°?",en:"Third angle of a triangle with angles 60° and 70°?"},steps:{bm:["Jumlah sudut segi tiga = 180°.","180 − 60 − 70 = 50.","Sudut ketiga = 50°."],en:["Angles in a triangle sum to 180°.","180 − 60 − 70 = 50.","Third angle = 50°."]}},
   {q:{bm:"Bentuk manakah yang mempunyai 5 muka?",en:"Which shape has 5 faces?"},steps:{bm:["Piramid segi empat mempunyai 1 tapak + 4 muka segi tiga.","Jumlah muka = 5.","Jawapan: piramid segi empat."],en:["A square pyramid has 1 base + 4 triangular faces.","Total faces = 5.","Answer: square pyramid."]}}],
  mistakes:{bm:"Kesilapan biasa: mengira bucu kubus sebagai 6 (itu bilangan muka!). Ingat: kubus = 6 muka, 12 tepi, 8 bucu.",en:"Common mistake: counting a cube's vertices as 6 (that's the number of faces!). Remember: cube = 6 faces, 12 edges, 8 vertices."},
  application:{bm:"Mengenal bentuk dalam bangunan, kotak, tin minuman dan bola.",en:"Recognising shapes in buildings, boxes, drink cans and balls."},
  summary:{bm:"2D = rata, 3D = pepejal. Kubus: 6 muka, 12 tepi, 8 bucu. Jumlah sudut segi tiga = 180°.",en:"2D = flat, 3D = solid. Cube: 6 faces, 12 edges, 8 vertices. Triangle angles sum to 180°."}},
 {id:"m6l2",title:{bm:"Perimeter, Luas dan Isipadu",en:"Perimeter, Area and Volume"},sim:"area",skills:["perimeter","area","volume"],
  ref:"DSKP 9.3.1–9.4.2 (Perimeter, Luas, Isipadu)",
  objectives:{bm:["Mengira perimeter bentuk 2D.","Mengira luas segi empat tepat dan segi tiga.","Mengira isipadu kubus dan kuboid."],en:["Calculate the perimeter of 2D shapes.","Calculate the area of rectangles and triangles.","Calculate the volume of cubes and cuboids."]},
  terms:{bm:{"Luas":"Kawasan yang diliputi oleh bentuk (unit²).","Isipadu":"Ruang yang dipenuhi oleh bentuk 3D (unit³)."},en:{"Area":"The space covered by a shape (unit²).","Volume":"The space filled by a 3D shape (unit³)."}},
  explain:{bm:`<p><b>Perimeter</b> = jumlah semua sisi.</p>
  <p><b>Luas</b> segi empat tepat = panjang × lebar. <b>Luas</b> segi tiga = ½ × tapak × tinggi.</p>
  <p><b>Isipadu</b> kuboid = panjang × lebar × tinggi. <b>Isipadu</b> kubus = sisi × sisi × sisi.</p>`,
  en:`<p><b>Perimeter</b> = sum of all sides.</p>
  <p><b>Area</b> of a rectangle = length × width. <b>Area</b> of a triangle = ½ × base × height.</p>
  <p><b>Volume</b> of a cuboid = length × width × height. <b>Volume</b> of a cube = side × side × side.</p>`},
  examples:[
   {q:{bm:"Luas segi empat tepat 9 cm × 6 cm?",en:"Area of a 9 cm × 6 cm rectangle?"},steps:{bm:["Luas = panjang × lebar.","9 × 6 = 54.","Luas = 54 cm²."],en:["Area = length × width.","9 × 6 = 54.","Area = 54 cm²."]}},
   {q:{bm:"Luas segi tiga tapak 10 cm, tinggi 6 cm?",en:"Area of a triangle with base 10 cm, height 6 cm?"},steps:{bm:["Luas = ½ × tapak × tinggi.","½ × 10 × 6 = 30.","Luas = 30 cm²."],en:["Area = ½ × base × height.","½ × 10 × 6 = 30.","Area = 30 cm²."]}},
   {q:{bm:"Isipadu kubus bersisi 5 cm?",en:"Volume of a cube with side 5 cm?"},steps:{bm:["Isipadu = sisi × sisi × sisi.","5 × 5 × 5 = 125.","Isipadu = 125 cm³."],en:["Volume = side × side × side.","5 × 5 × 5 = 125.","Volume = 125 cm³."]}}],
  mistakes:{bm:"Kesilapan biasa: tertukar perimeter dengan luas (perimeter = keliling, luas = kawasan dalam). Juga, luas segi tiga mesti didarab ½!",en:"Common mistake: confusing perimeter with area (perimeter = boundary, area = inside space). Also, triangle area must be multiplied by ½!"},
  application:{bm:"Mengira cat dinding, jubin lantai, dan isipadu kotak untuk membungkus hadiah.",en:"Calculating wall paint, floor tiles, and box volume for wrapping gifts."},
  summary:{bm:"Perimeter = jumlah sisi. Luas segi empat tepat = P×L. Luas segi tiga = ½×T×t. Isipadu kuboid = P×L×t.",en:"Perimeter = sum of sides. Rectangle area = L×W. Triangle area = ½×B×H. Cuboid volume = L×W×H."}}]},
{id:"m7",icon:"🗺️",color:"#0891b2",title:{bm:"Koordinat, Nisbah dan Kadaran",en:"Coordinates, Ratio and Proportion"},
 desc:{bm:"Koordinat kartesian, nisbah, hubungan berkadar dan aplikasi kehidupan sebenar.",en:"Cartesian coordinates, ratios, proportional relationships and real-world applications."},
 lessons:[
 {id:"m7l1",title:{bm:"Koordinat Kartesian",en:"Cartesian Coordinates"},sim:"coord",skills:["coordinates"],
  ref:"DSKP 10.1.1–10.2.2 (Koordinat)",
  objectives:{bm:["Membaca dan memplot titik pada grid koordinat.","Mengenal pasti kedudukan objek menggunakan koordinat (x, y)."],en:["Read and plot points on a coordinate grid.","Identify object positions using (x, y) coordinates."]},
  terms:{bm:{"Paksi-x":"Garis mengufuk (bergerak ke kanan).","Paksi-y":"Garis menegak (bergerak ke atas).","Koordinat":"Pasangan nombor (x, y) yang menunjukkan kedudukan titik."},en:{"x-axis":"The horizontal line (moves right).","y-axis":"The vertical line (moves up).","Coordinates":"A pair of numbers (x, y) showing a point's position."}},
  explain:{bm:`<p>Koordinat ditulis sebagai <b>(x, y)</b>: bergerak <b>sepanjang paksi-x dahulu</b> (kanan), kemudian <b>naik paksi-y</b>.</p>
  <p>Contoh: titik (3, 2) → 3 unit ke kanan, 2 unit ke atas dari asalan (0,0).</p>
  <p>Ingat: <b>masuk pintu, naik tangga</b> — x dahulu, kemudian y!</p>`,
  en:`<p>Coordinates are written as <b>(x, y)</b>: move <b>along the x-axis first</b> (right), then <b>up the y-axis</b>.</p>
  <p>Example: point (3, 2) → 3 units right, 2 units up from the origin (0,0).</p>
  <p>Remember: <b>walk through the door, climb the stairs</b> — x first, then y!</p>`},
  examples:[
   {q:{bm:"Apakah koordinat titik yang 4 unit ke kanan dan 1 unit ke atas?",en:"What are the coordinates of a point 4 units right and 1 unit up?"},steps:{bm:["x = 4 (kanan).","y = 1 (atas).","Koordinat: (4, 1)."],en:["x = 4 (right).","y = 1 (up).","Coordinates: (4, 1)."]}},
   {q:{bm:"Titik (2, 5) dan (5, 2) — adakah sama?",en:"Points (2, 5) and (5, 2) — are they the same?"},steps:{bm:["(2, 5): 2 kanan, 5 atas.","(5, 2): 5 kanan, 2 atas.","Tidak sama! Urutan penting."],en:["(2, 5): 2 right, 5 up.","(5, 2): 5 right, 2 up.","Not the same! Order matters."]}},
   {q:{bm:"Berapa unit jarak antara (1, 3) dan (1, 7)?",en:"How many units between (1, 3) and (1, 7)?"},steps:{bm:["Kedua-dua mempunyai x = 1 (garis menegak yang sama).","Jarak = 7 − 3 = 4 unit."],en:["Both have x = 1 (same vertical line).","Distance = 7 − 3 = 4 units."]}}],
  mistakes:{bm:"Kesilapan biasa: tertukar x dan y. Ingat: (x, y) — x dahulu (kanan), y kemudian (atas). Bayangkan anda masuk melalui pintu (x) lalu naik tangga (y)!",en:"Common mistake: swapping x and y. Remember: (x, y) — x first (right), y second (up). Imagine walking through the door (x) then climbing stairs (y)!"},
  application:{bm:"Membaca peta, mencari alamat, dan bermain permainan video (kedudukan watak).",en:"Reading maps, finding addresses, and playing video games (character positions)."},
  summary:{bm:"Koordinat (x, y): x = kanan, y = atas. Urutan penting — (2,5) ≠ (5,2).",en:"Coordinates (x, y): x = right, y = up. Order matters — (2,5) ≠ (5,2)."}},
 {id:"m7l2",title:{bm:"Nisbah dan Kadaran",en:"Ratio and Proportion"},sim:"ratio",skills:["ratio","proportion"],
  ref:"DSKP 10.3.1–10.4.2 (Nisbah dan Kadaran)",
  objectives:{bm:["Menyatakan nisbah dalam bentuk paling mudah.","Menyelesaikan masalah nisbah dan kadaran.","Menggunakan nisbah dalam resipi dan campuran."],en:["Express ratios in simplest form.","Solve ratio and proportion problems.","Use ratios in recipes and mixtures."]},
  terms:{bm:{"Nisbah":"Perbandingan dua kuantiti, ditulis sebagai a : b.","Kadaran":"Hubungan yang menunjukkan dua kuantiti berubah bersama."},en:{"Ratio":"A comparison of two quantities, written as a : b.","Proportion":"A relationship showing two quantities changing together."}},
  explain:{bm:`<p><b>Nisbah</b> a : b membandingkan dua kuantiti. Untuk memudahkan, bahagi kedua-dua dengan faktor sepunya terbesar (FSTB).</p>
  <p>Contoh: 12 : 18 → bahagi dengan 6 → <b>2 : 3</b>.</p>
  <p><b>Kadaran:</b> jika 2 cawan tepung untuk 4 cawan air, maka untuk 6 cawan air perlu 3 cawan tepung (darab kedua-dua dengan 1.5).</p>`,
  en:`<p>A <b>ratio</b> a : b compares two quantities. To simplify, divide both by their greatest common factor (GCF).</p>
  <p>Example: 12 : 18 → divide by 6 → <b>2 : 3</b>.</p>
  <p><b>Proportion:</b> if 2 cups of flour need 4 cups of water, then 6 cups of water need 3 cups of flour (multiply both by 1.5).</p>`},
  examples:[
   {q:{bm:"Mudahkan nisbah 12 : 18.",en:"Simplify the ratio 12 : 18."},steps:{bm:["FSTB bagi 12 dan 18 ialah 6.","12 ÷ 6 = 2, 18 ÷ 6 = 3.","Nisbah paling mudah: 2 : 3."],en:["GCF of 12 and 18 is 6.","12 ÷ 6 = 2, 18 ÷ 6 = 3.","Simplest ratio: 2 : 3."]}},
   {q:{bm:"Resipi memerlukan 2 cawan tepung : 3 cawan susu. Untuk 6 cawan susu, berapa tepung?",en:"A recipe needs 2 cups flour : 3 cups milk. For 6 cups milk, how much flour?"},steps:{bm:["3 → 6 ialah darab 2.","2 × 2 = 4.","Perlu 4 cawan tepung."],en:["3 → 6 is multiply by 2.","2 × 2 = 4.","Need 4 cups of flour."]}},
   {q:{bm:"Nisbah lelaki : perempuan dalam kelas ialah 3 : 2. Jika ada 12 lelaki, berapa perempuan?",en:"Ratio of boys : girls in a class is 3 : 2. If there are 12 boys, how many girls?"},steps:{bm:["3 → 12 ialah darab 4.","2 × 4 = 8.","Ada 8 perempuan."],en:["3 → 12 is multiply by 4.","2 × 4 = 8.","There are 8 girls."]}}],
  mistakes:{bm:"Kesilapan biasa: menambah nisbah seperti pecahan (cth: 2:3 + 1:2). Nisbah bukan pecahan yang boleh ditambah terus — ia perbandingan!",en:"Common mistake: adding ratios like fractions (e.g. 2:3 + 1:2). Ratios are not fractions that can be added directly — they are comparisons!"},
  application:{bm:"Mengadun minuman, mengira resipi untuk lebih ramai orang, dan membahagi hadiah mengikut nisbah.",en:"Mixing drinks, scaling recipes for more people, and sharing prizes by ratio."},
  summary:{bm:"Mudahkan nisbah dengan FSTB. Untuk kadaran, darabkan kedua-dua kuantiti dengan faktor yang sama.",en:"Simplify ratios with the GCF. For proportions, multiply both quantities by the same factor."}}]},
{id:"m8",icon:"📊",color:"#65a30d",title:{bm:"Pengurusan Data",en:"Data Handling"},
 desc:{bm:"Mengumpul dan menyusun data, membaca carta dan mentafsir statistik.",en:"Collecting and organising data, reading charts and interpreting statistics."},
 lessons:[
 {id:"m8l1",title:{bm:"Mengumpul dan Menyusun Data",en:"Collecting and Organising Data"},sim:"chart",skills:["data","tables"],
  ref:"DSKP 11.1.1–11.2.2 (Pengurusan Data)",
  objectives:{bm:["Mengumpul data melalui tinjauan mudah.","Menyusun data dalam jadual dan carta bar.","Membaca maklumat daripada carta."],en:["Collect data through simple surveys.","Organise data in tables and bar charts.","Read information from charts."]},
  terms:{bm:{"Data":"Maklumat yang dikumpul (nombor, kategori).","Carta bar":"Carta yang menggunakan bar untuk menunjukkan kuantiti."},en:{"Data":"Collected information (numbers, categories).","Bar chart":"A chart using bars to show quantities."}},
  explain:{bm:`<p><b>Data</b> boleh dikumpul melalui tinjauan, pemerhatian atau pengukuran.</p>
  <p><b>Jadual</b> menyusun data dengan kemas. <b>Carta bar</b> menunjukkan perbandingan dengan mudah — bar yang lebih tinggi bermaksud nilai lebih besar.</p>
  <p>Apabila membaca carta: (1) baca tajuk, (2) baca paksi, (3) bandingkan bar.</p>`,
  en:`<p><b>Data</b> can be collected through surveys, observations or measurements.</p>
  <p><b>Tables</b> organise data neatly. <b>Bar charts</b> show comparisons easily — taller bars mean larger values.</p>
  <p>When reading a chart: (1) read the title, (2) read the axes, (3) compare the bars.</p>`},
  examples:[
   {q:{bm:"Carta bar menunjukkan: Epal 8, Oren 5, Pisang 11. Buah paling popular?",en:"Bar chart shows: Apples 8, Oranges 5, Bananas 11. Most popular fruit?"},steps:{bm:["Bandingkan ketinggian bar.","Pisang mempunyai bar tertinggi (11).","Buah paling popular: pisang."],en:["Compare bar heights.","Bananas have the tallest bar (11).","Most popular fruit: bananas."]}},
   {q:{bm:"Jumlah murid dari carta: 8 + 5 + 11 = ?",en:"Total pupils from the chart: 8 + 5 + 11 = ?"},steps:{bm:["8 + 5 = 13.","13 + 11 = 24.","Jumlah: 24 murid."],en:["8 + 5 = 13.","13 + 11 = 24.","Total: 24 pupils."]}},
   {q:{bm:"Perbezaan antara pisang dan oren?",en:"Difference between bananas and oranges?"},steps:{bm:["11 − 5 = 6.","Perbezaan: 6."],en:["11 − 5 = 6.","Difference: 6."]}}],
  mistakes:{bm:"Kesilapan biasa: membaca skala carta dengan salah (cth: mengira setiap garis sebagai 1 padahal ia mewakili 5). Sentiasa semak nilai pada paksi!",en:"Common mistake: misreading the chart scale (e.g. counting each line as 1 when it represents 5). Always check the axis values!"},
  application:{bm:"Mengira bilangan undian kelas, markah ujian, dan data cuaca.",en:"Counting class votes, test scores, and weather data."},
  summary:{bm:"Kumpul data → susun dalam jadual → tunjukkan dalam carta bar. Baca tajuk dan skala dahulu.",en:"Collect data → organise in a table → display in a bar chart. Read the title and scale first."}},
 {id:"m8l2",title:{bm:"Mentafsir Data dan Statistik",en:"Interpreting Data and Statistics"},sim:"table",skills:["interpret","statistics"],
  ref:"DSKP 11.3.1–11.4.2 (Tafsiran Data)",
  objectives:{bm:["Mentafsir maklumat daripada carta dan jadual.","Membuat kesimpulan mudah berdasarkan data.","Menyelesaikan masalah menggunakan data."],en:["Interpret information from charts and tables.","Draw simple conclusions based on data.","Solve problems using data."]},
  terms:{bm:{"Purata":"Jumlah semua nilai dibahagi dengan bilangan nilai."},en:{"Average (mean)":"The sum of all values divided by the number of values."}},
  explain:{bm:`<p><b>Purata</b> = jumlah semua nilai ÷ bilangan nilai. Contoh: markah 70, 80, 90 → purata = (70+80+90) ÷ 3 = 80.</p>
  <p><b>Mentafsir data:</b> cari nilai tertinggi, terendah, perbezaan dan jumlah keseluruhan.</p>`,
  en:`<p><b>Average (mean)</b> = sum of all values ÷ number of values. Example: marks 70, 80, 90 → average = (70+80+90) ÷ 3 = 80.</p>
  <p><b>Interpreting data:</b> find the highest value, lowest value, difference and total.</p>`},
  examples:[
   {q:{bm:"Purata bagi 70, 80, 90?",en:"Average of 70, 80, 90?"},steps:{bm:["Jumlah: 70 + 80 + 90 = 240.","Bilangan nilai: 3.","Purata: 240 ÷ 3 = 80."],en:["Sum: 70 + 80 + 90 = 240.","Number of values: 3.","Average: 240 ÷ 3 = 80."]}},
   {q:{bm:"Data suhu: 28, 30, 29, 31, 30. Suhu tertinggi?",en:"Temperature data: 28, 30, 29, 31, 30. Highest temperature?"},steps:{bm:["Bandingkan semua nilai.","Nilai terbesar ialah 31.","Suhu tertinggi: 31°C."],en:["Compare all values.","The largest value is 31.","Highest temperature: 31°C."]}},
   {q:{bm:"Jika 5 murid mendapat 100 markah dan jumlah markah kelas ialah 2,500 untuk 25 murid, purata kelas?",en:"If the class total is 2,500 marks for 25 pupils, what is the class average?"},steps:{bm:["Purata = jumlah ÷ bilangan.","2,500 ÷ 25 = 100.","Purata kelas: 100."],en:["Average = total ÷ count.","2,500 ÷ 25 = 100.","Class average: 100."]}}],
  mistakes:{bm:"Kesilapan biasa: melupakan membahagi dengan bilangan nilai semasa mengira purata. Purata = jumlah ÷ bilangan — jangan lupa bahagi!",en:"Common mistake: forgetting to divide by the number of values when calculating the average. Average = total ÷ count — don't forget to divide!"},
  application:{bm:"Mengira purata markah, membandingkan jualan kedai, dan meramal cuaca.",en:"Calculating average marks, comparing shop sales, and forecasting weather."},
  summary:{bm:"Purata = jumlah ÷ bilangan. Baca data dengan teliti: tertinggi, terendah, perbezaan, jumlah.",en:"Average = total ÷ count. Read data carefully: highest, lowest, difference, total."}}]},
{id:"m9",icon:"🎲",color:"#c026d3",title:{bm:"Kebolehjadian",en:"Probability"},
 desc:{bm:"Memahami kebolehjadian, peristiwa mungkin dan mustahil, serta eksperimen mudah.",en:"Understanding likelihood, possible and impossible events, and simple experiments."},
 lessons:[
 {id:"m9l1",title:{bm:"Memahami Kebolehjadian",en:"Understanding Probability"},sim:"coin",skills:["probability","likelihood"],
  ref:"DSKP 12.1.1–12.2.2 (Kebolehjadian)",
  objectives:{bm:["Mengenal pasti peristiwa yang pasti, mungkin, kurang mungkin dan mustahil.","Membandingkan kebolehjadian peristiwa."],en:["Identify certain, likely, unlikely and impossible events.","Compare the likelihood of events."]},
  terms:{bm:{"Pasti":"Peristiwa yang akan berlaku (kebolehjadian 1).","Mustahil":"Peristiwa yang tidak akan berlaku (kebolehjadian 0).","Mungkin":"Peristiwa yang boleh berlaku atau tidak."},en:{"Certain":"An event that will definitely happen (probability 1).","Impossible":"An event that will never happen (probability 0).","Possible":"An event that may or may not happen."}},
  explain:{bm:`<p><b>Kebolehjadian</b> mengukur peluang sesuatu peristiwa berlaku, dari <b>0 (mustahil)</b> hingga <b>1 (pasti)</b>.</p>
  <p>Contoh: melontar syiling → peluang dapat kepala = 1/2.</p>

/* ================= QUESTION ENGINE (procedural, seeded, validated) ================= */
let qCounter=0;
function mkQ(module,skill,diff,type,q,answer,opts){return{id:"Q"+(++qCounter)+"-"+skill+"-"+diff,module,skill,diff,type,
  q,answer,opts:opts||{},seed:Math.floor(rng()*1e9)}}
/* Build 4 unique options. Always terminates: pools with <3 distinct distractors
   are topped up with format-preserving variants (numbers, fractions, RM). */
function mcqOpts(correct,pool){
  const c=String(correct), s=new Set([c]);
  for(const v of (pool||[])){if(s.size>=4)break;const t=String(v);
    if(t!==c&&!/^(null|undefined|NaN|)$/.test(t))s.add(t)}
  let k=1;
  while(s.size<4&&k<=40){
    const fracM=c.match(/^(-?\d+)\/(\d+)$/), rmM=c.match(/^RM\s*([\d.]+)$/i), numM=c.match(/^(-?\d+(?:\.\d+)?)$/);
    let cand;
    if(fracM){const n=+fracM[1],d=+fracM[2];
      const o=[[n+1,d],[n,d+1],[Math.max(0,n-1)||1,d],[n+1,d+1],[d,n],[n,d>1?d-1:2]][(k-1)%6];
      cand=o[0]+"/"+o[1]}
    else if(rmM){const v=+rmM[1];const adj=[v+0.5,v-0.5,v+1,v-1,v+0.1,v+2,v-2,v+5][(k-1)%8];
      cand="RM "+Math.max(0,adj).toFixed(2)}
    else if(numM){const v=+numM[1];const adj=[v+1,v-1,v+10,v-10,v+2,v-2,v+5,v-5,v+100,v-100][(k-1)%10];
      const isInt=Number.isInteger(v);
      cand=String(Math.max(0,adj));if(!isInt)cand=(Math.max(0,adj)).toFixed(2)}
    else {cand=c+" "+["(i)","(ii)","(iii)","(iv)"][(k-1)%4]}
    if(cand!==c)s.add(cand);
    k++;
  }
  return shuffle([...s].slice(0,4))
}
const DIFFS=["easy","medium","hard","kbat"];
function genQuestion(moduleId,skill,diff,seed){
  if(seed!==undefined&&seed!==null)reseed(seed);
  diff=diff||"medium";const R=(a,b)=>ri(a,b);
  const M=(q,ans,extra)=>Object.assign(mkQ(moduleId,skill,diff,"mcq",q,ans),extra||{});
  switch(skill){
  case "placevalue":{const n=R(10000,999999),pos=R(0,String(n).length-1),d=Number(String(n)[pos]);
    const placeVal=Math.pow(10,String(n).length-1-pos);
    return M(L(`Apakah nilai digit ${d} dalam ${fmt(n)}?`,`What is the value of the digit ${d} in ${fmt(n)}?`),d*placeVal,
      {options:mcqOpts(d*placeVal,[d*placeVal*10,d*placeVal/10||d*placeVal*2,d*placeVal+placeVal]),
       hint:L("Kira nilai tempat digit tersebut, kemudian darabkan.","Find the place value of that digit, then multiply."),
       expl:L(`Digit ${d} berada di tempat ${fmt(placeVal)}. Nilai = ${d} × ${fmt(placeVal)} = ${fmt(d*placeVal)}.`,`Digit ${d} is in the ${fmt(placeVal)} place. Value = ${d} × ${fmt(placeVal)} = ${fmt(d*placeVal)}.`),
       ref:"DSKP 4.1.1"})}
  case "compare":{const a=R(1000,999999);let b=a+R(-5000,5000);if(b===a)b+=1;if(b<0)b=a+100;
    const small=Math.min(a,b),big=Math.max(a,b);

      {options:shuffle([fmt(a),fmt(b),fmt(small-1),fmt(big+1)]),
       hint:L("Bandingkan bilangan digit dahulu, kemudian dari kiri.","Compare the number of digits first, then from the left."),
       expl:L(`${fmt(big)} lebih besar daripada ${fmt(small)}.`,`${fmt(big)} is larger than ${fmt(small)}.`),ref:"DSKP 4.1.3"})}

      {options:mcqOpts(fmt(r),[fmt(r+p),fmt(r-p),fmt(n)]),
       hint:L("Lihat digit di sebelah kanan tempat pembundaran.","Look at the digit right of the rounding place."),

      {options:mcqOpts(String(ans),[String(ans+10),String(ans-10),String(ans+100),String(ans-100)]),

  case "mult":{const a=R(12,999),b=R(3,19);const ans=a*b;

       expl:L(`${a} ÷ ${b} = ${q} kerana ${b} × ${q} = ${a}.`,`${a} ÷ ${b} = ${q} because ${b} × ${q} = ${a}.`),ref:"DSKP 4.2.4"})}

/* Adaptive difficulty: deterministic, based on per-skill accuracy */
function nextDifficulty(skill){const acc=skillAcc(skill);if(acc===null)return "easy";
  if(acc>=0.85)return "hard";if(acc>=0.65)return "medium";if(acc>=0.4)return "easy";return "easy"}
function weakSkills(){return Object.keys(S.skill).map(sk=>({sk,acc:skillAcc(sk)})).filter(x=>x.acc!==null&&x.acc<0.6).sort((a,b)=>a.acc-b.acc).map(x=>x.sk)}
function allSkills(){return MODULES.flatMap(m=>m.lessons.flatMap(l=>l.skills))}
/* Step-by-step solver for long multiplication/division */
function solveSteps(a,b,op){
  if(op==="×"){const ones=a*(b%10),tens=a*Math.floor(b/10)*10;return{L:`${a} × ${b}`,steps:[
    L(`Darabkan dengan digit sa: ${a} × ${b%10} = ${ones}`,`Multiply by ones digit: ${a} × ${b%10} = ${ones}`),
    L(`Darabkan dengan digit puluh: ${a} × ${Math.floor(b/10)*10} = ${tens}`,`Multiply by tens digit: ${a} × ${Math.floor(b/10)*10} = ${tens}`),
    L(`Jumlahkan: ${ones} + ${tens} = ${ones+tens}`,`Add: ${ones} + ${tens} = ${ones+tens}`)],ans:ones+tens}}
  const q=Math.floor(a/b),r=a%b;return{L:`${a} ÷ ${b}`,steps:[
    L(`${b} × ${q} = ${b*q}. Baki: ${a} − ${b*q} = ${r}.`,`${b} × ${q} = ${b*q}. Remainder: ${a} − ${b*q} = ${r}.`),
    r===0?L(`Baki 0, jadi jawapan tepat: ${q}.`,`Remainder 0, so the answer is exact: ${q}.`):L(`Jawapan: ${q} baki ${r}.`,`Answer: ${q} remainder ${r}.`)],ans:q}}

function exportProgress(){const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});

function importProgress(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(typeof d.xp!=="number"||!d.skill)throw 0;S=Object.assign({},DEF,d);save();toast(t("importDone"));render()}catch(e){toast(t("importFail"))}};r.readAsText(file)}

/* ---------- Quiz runner ---------- */
let QUIZ=null;
function vQuizRoute(){layout(`<p class="mt"><a href="#/home">← ${t("home")}</a></p><div id="quiz-root"></div>`,"practice")}
function startQuiz(cfg){QUIZ={...cfg,idx:0,score:0,qs:[],timer:null,timeLeft:cfg.timed||0,streak:0,bestStreak:0};
 for(let i=0;i<cfg.count;i++){const sk=pick(cfg.skills);const diff=cfg.guided?"easy":nextDifficulty(sk);
  QUIZ.qs.push(genQuestion(cfg.moduleId==="mixed"?"m1":cfg.moduleId,sk,diff))}
 QUIZ.qs.forEach(q=>{if(!q.options||!q.options.length)q.options=mcqOpts(q.answer,[q.answer+" ",q.answer+"x",q.answer+"1"])});
 location.hash="#/quiz";renderQuiz()}
function renderQuiz(){const Q=QUIZ;if(!Q)return;
 if(Q.timed&&Q.idx===0&&!Q.timer){Q.timer=setInterval(()=>{Q.timeLeft--;const el=$("#q-timer");if(el)el.textContent="⏱️ "+Q.timeLeft+"s";
  if(Q.timeLeft<=0){clearInterval(Q.timer);finishQuiz()}},1000)}
 if(Q.idx>=Q.qs.length)return finishQuiz();
 const q=Q.qs[Q.idx];const isMCQ=q.options&&q.options.length>0;
 layout(`<div class="qcard"><div class="flex"><b>${t("question")} ${Q.idx+1}/${Q.qs.length}</b>
 <span class="pill">${t("difficulty")}: ${t(q.diff)}</span><span class="pill xp">⚡ ${Q.score*10} ${t("xp")}</span>
 ${Q.timed?`<span class="pill" id="q-timer">⏱️ ${Q.timeLeft}s</span>`:""}<span class="spacer"></span>
 <button class="btn small ghost" id="q-quit">${t("finish")}</button></div>
 <p class="qtext">${esc(q.q)}</p>
 ${isMCQ?`<div class="opts" role="group" aria-label="${t("question")} ${Q.idx+1}">${q.options.map(o=>`<button class="opt" role="radio" aria-checked="false" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`
 :`<div class="sim-controls"><input type="text" id="q-input" class="answer-input" placeholder="${t("typeAnswer")}" autocomplete="off"><button class="btn" id="q-check">${t("check")}</button></div>`}
 <div class="flex mt"><button class="btn small ghost" id="q-hint">💡 ${t("hint")}</button>
 <button class="btn small ghost" id="q-steps">${t("showSteps")}</button></div>
 <div id="q-hintbox" aria-live="polite"></div><div id="q-fb" role="status" aria-live="polite"></div></div>`,"practice");
 $("#q-quit").onclick=()=>{if(Q.timer)clearInterval(Q.timer);finishQuiz(true)};
 $("#q-hint").onclick=()=>{$("#q-hintbox").innerHTML=`<div class="feedback hint">💡 ${esc(q.hint||t("tigerHint"))}</div>`;sfx.click()};
 $("#q-steps").onclick=()=>{$("#q-hintbox").innerHTML=`<div class="steps"><b>${t("explanation")}:</b> ${esc(q.expl||"")}</div>`;sfx.click()};
 const answer=(val)=>{const ok=String(val).trim().toLowerCase()===String(q.answer).trim().toLowerCase();
  recordAnswer(q.skill,ok);if(ok){Q.score++;Q.streak++;Q.bestStreak=Math.max(Q.bestStreak,Q.streak);addXP(10);sfx.good();
   $("#q-fb").innerHTML=`<div class="feedback good">${t("correct")} ${t("tigerGood")}<br><b>${t("explanation")}:</b> ${esc(q.expl||"")}</div>`}
  else{Q.streak=0;sfx.bad();$("#q-fb").innerHTML=`<div class="feedback bad">${t("wrong")} ${t("tigerBad")}<br><b>${t("answer")}: ${esc(q.answer)}</b><br><b>${t("explanation")}:</b> ${esc(q.expl||"")}</div>`}
  $$(".opt").forEach(b=>{b.disabled=true;b.setAttribute("aria-checked",b.dataset.o===String(val)?"true":"false");
   if(b.dataset.o===String(q.answer)){b.classList.add("correct");b.setAttribute("aria-label",b.textContent+" — "+t("answer"))}
   else if(b.dataset.o===String(val))b.classList.add("wrong")});
  const nb=document.createElement("button");nb.className="btn green mt";nb.textContent=Q.idx+1<Q.qs.length?t("next"):t("finish");
  nb.onclick=()=>{Q.idx++;renderQuiz()};$("#q-fb").appendChild(nb);nb.focus()};
 if(isMCQ)$$(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.o));
 else{$("#q-check").onclick=()=>answer($("#q-input").value);$("#q-input").addEventListener("keydown",e=>{if(e.key==="Enter")answer(e.target.value)})}}
function finishQuiz(quit){const Q=QUIZ;if(!Q)return;if(Q.timer)clearInterval(Q.timer);
 const total=Q.qs.length,score=Q.score,pct=total?score/total:0;
 let stars=0;if(pct>=0.5)stars=1;if(pct>=0.75)stars=2;if(pct>=0.9)stars=3;
 if(["m1","m2","m3","m4","m5","m6","m7","m8","m9"].includes(Q.moduleId)){S.stars[Q.moduleId]=Math.max(S.stars[Q.moduleId]||0,stars);save()}
 if(pct>=0.6){sfx.win();confetti()}
 const weak=Q.qs.filter((q,i)=>{const h=S.history.find(x=>x.sk===q.skill);return h&&!h.ok}).map(q=>q.skill);
 layout(`<div class="card center mt"><div class="big-emoji">${pct>=0.6?"🎉":"💪"}</div>
 <h2>${t("quizDone")}</h2><p style="font-size:1.4rem"><b>${t("yourScore")}: ${score}/${total} (${Math.round(pct*100)}%)</b></p>
 <p class="stars" style="font-size:1.6rem">${starsStr(stars)}</p>
 <p>${pct>=0.6?t("welldone")+" "+esc(Q.title):t("keepgoing")}</p>
 ${weak.length?`<p class="muted">${t("weak")}: ${[...new Set(weak)].join(", ")}</p>`:""}
 ${Q.diagnostic?`<p class="muted">${L("Berdasarkan keputusan ini, TIGER BIJAK akan mencadangkan topik untuk anda. Mulakan dari peta pengembaraan!","Based on these results, TIGER BIJAK will recommend topics for you. Start from the adventure map!")}</p>`:""}
 <div class="flex" style="justify-content:center"><button class="btn" id="fq-again">${t("playAgain")}</button>
 <a class="btn ghost" href="#/map">${t("backMap")}</a></div></div>`,"practice");
 $("#fq-again").onclick=()=>startQuiz(Q);QUIZ=null;checkBadges()}

/* ---------- Init ---------- */
/* Offline support: register the service worker when served over http(s).
   Fails silently on file:// and in sandboxed previews — the app still works online. */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#/quiz")&&QUIZ)renderQuiz();else render()});
if(location.hash.startsWith("#/quiz")&&!QUIZ)location.hash="#/home";
render();
